name: Validate specification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: false
      - name: Fetch and verify pinned native compiler source
        id: engine-source
        run: |
          python3 scripts/wasm-prototype/build.py --prepare-only > "$RUNNER_TEMP/engine-source.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/engine-source.json")); print("path="+p["sourcePath"])' >> "$GITHUB_OUTPUT"
      - name: Build native compiler
        working-directory: ${{ steps.engine-source.outputs.path }}
        run: |
          go generate ./internal/workspace/libs
          go build -o ../sysml ./cmd/sysml
      - name: Validate product specification
        run: python3 scripts/validate_spec.py --sysml "$PWD/.tools/sysml"
